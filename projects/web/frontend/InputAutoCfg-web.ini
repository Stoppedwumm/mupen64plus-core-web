; InputAutoCfg.ini for the Mupen64Plus web build (projects/web/build.sh puts
; these sections in front of input-sdl's own file and drops its [Keyboard]).
; Key numbers are SDL 1.2 keysyms.

; Browser-game layout: arrows move, Space jumps (A), X attacks (B),
; Z crouches (Z), W/A/S/D move the camera (C buttons), E changes the
; camera mode (R), Enter is Start.
[Keyboard]
plugged = True
mouse = False
DPad R =
DPad L =
DPad D =
DPad U =
Start = key(13)
Z Trig = key(122)
B Button = key(120)
A Button = key(32)
C Button R = key(100)
C Button L = key(97)
C Button D = key(115)
C Button U = key(119)
R Trig = key(101)
L Trig = key(113)
Mempak switch =
Rumblepak switch =
X Axis = key(276,275)
Y Axis = key(273,274)

; Browsers expose pads with the W3C "standard" layout as
; "<name> (STANDARD GAMEPAD ...)" (Chromium)
[STANDARD GAMEPAD]
plugged = True
mouse = False
AnalogDeadzone = 4096,4096
AnalogPeak = 32768,32768
DPad R = button(15)
DPad L = button(14)
DPad D = button(13)
DPad U = button(12)
Start = button(9)
Z Trig = button(6)
B Button = button(2)
A Button = button(0)
C Button R = axis(2+)
C Button L = axis(2-)
C Button D = axis(3+)
C Button U = axis(3-)
R Trig = button(5)
L Trig = button(4)
Mempak switch =
Rumblepak switch =
X Axis = axis(0-,0+)
Y Axis = axis(1-,1+)
