<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario 64</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #000;
    --text: #fff;
    --muted: rgba(255, 255, 255, .72);
    --panel: rgba(12, 14, 22, .82);
    --accent: #e52521;
    --accent-dark: #a3150f;
    --gold: #fbd000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; }

  /* the game: 4:3, as large as the frame allows, centered */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { position: relative; aspect-ratio: 4 / 3; width: min(100vw, calc(100vh * 4 / 3)); }
  /* !important: SDL sets an inline size on the canvas */
  #canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important;
    display: block; outline: none;
    background: #000; }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2.2vmin; text-align: center; padding: 4vmin; }
  .overlay[hidden] { display: none; }

  /* splash */
  #splash { background: radial-gradient(ellipse at 50% 35%, #2b5cd6 0%, #142c78 55%, #070d24 100%); }
  #splash h1 { margin: 0; font-size: clamp(28px, 9vmin, 84px); line-height: 1; font-weight: 900;
    letter-spacing: .02em; color: var(--gold); text-shadow: 0 .06em 0 #b8860b, 0 .12em .25em rgba(0,0,0,.5); }
  #splash h1 span { display: block; font-size: .55em; color: #fff; text-shadow: 0 .08em 0 #8a1410; }
  #play { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 800;
    font-size: clamp(18px, 4.6vmin, 34px); line-height: 1;
    color: #fff; background: var(--accent); padding: .6em 1.8em; border-radius: 999px;
    box-shadow: 0 .18em 0 var(--accent-dark), 0 .4em 1em rgba(0,0,0,.4); transition: transform .08s; }
  #play:hover:not(:disabled) { transform: translateY(-2px); }
  #play:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 .06em 0 var(--accent-dark); }
  #play:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #play:focus:not(:focus-visible) { outline: none; }
  #play:disabled { cursor: default; background: #555; box-shadow: none; }
  #progress { width: min(60%, 360px); height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
    overflow: hidden; }
  #progress div { height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  #status { color: var(--muted); font-size: clamp(12px, 2.4vmin, 16px); min-height: 1.4em; }

  .keys { display: grid; grid-template-columns: auto auto; gap: .35em 1.2em; text-align: left;
    font-size: clamp(11px, 2.3vmin, 15px); color: var(--muted); background: var(--panel);
    padding: .9em 1.2em; border-radius: 10px; }
  .keys b { color: #fff; font-weight: 600; }
  kbd { display: inline-block; min-width: 1.6em; padding: .05em .4em; border-radius: 4px; text-align: center;
    background: rgba(255,255,255,.14); border-bottom: 2px solid rgba(255,255,255,.25); color: #fff;
    font-family: inherit; font-weight: 600; font-size: .92em; line-height: 1.3; }
  .note { color: var(--muted); font-size: clamp(11px, 2.1vmin, 14px); }

  /* paused / lost focus */
  #paused { background: rgba(0, 0, 0, .6); cursor: pointer; }
  #paused h2 { margin: 0; font-size: clamp(22px, 7vmin, 56px); font-weight: 900; color: var(--gold); }

  /* corner buttons, shown while the mouse moves */
  #corner { position: absolute; top: 1.5vmin; right: 1.5vmin; display: flex; gap: 1vmin;
    opacity: 0; transition: opacity .3s; }
  #corner.show { opacity: 1; }
  #corner button { appearance: none; border: 0; cursor: pointer; width: clamp(30px, 6vmin, 44px);
    aspect-ratio: 1; border-radius: 8px; background: var(--panel); color: #fff; display: grid;
    place-items: center; padding: 0; }
  #corner svg { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; }

  /* achievement popup */
  #achievement { position: absolute; top: 2.5vmin; left: 50%; transform: translate(-50%, -150%);
    display: flex; align-items: center; gap: .8em; padding: .7em 1.2em .7em .8em; border-radius: 14px;
    background: linear-gradient(180deg, rgba(30, 34, 52, .95), rgba(14, 16, 26, .95));
    border: 2px solid var(--gold); box-shadow: 0 .4em 1.4em rgba(0,0,0,.5);
    transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); pointer-events: none;
    max-width: 92%; font-size: clamp(12px, 2.5vmin, 17px); }
  #achievement.show { transform: translate(-50%, 0); }
  #achievement .star { flex: none; width: 2.4em; height: 2.4em; }
  #achievement .label { color: var(--gold); font-size: .78em; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; }
  #achievement .title { font-weight: 800; }
  #achievement .desc { color: var(--muted); font-size: .85em; }

  #toast { position: absolute; left: 50%; bottom: 4vmin; transform: translate(-50%, 1em); opacity: 0;
    background: var(--panel); padding: .5em 1em; border-radius: 999px; font-size: clamp(12px, 2.4vmin, 16px);
    transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="stage">
  <div id="screen">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

    <div id="splash" class="overlay">
      <h1><span>Super</span>Mario 64</h1>
      <button id="play" disabled>Loading…</button>
      <div id="progress"><div></div></div>
      <div id="status"></div>
      <div class="keys">
        <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span><b>Move</b>
        <span><kbd>Space</kbd></span><b>Jump</b>
        <span><kbd>X</kbd></span><b>Punch / kick</b>
        <span><kbd>Z</kbd></span><b>Crouch / ground pound</b>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><b>Camera</b>
        <span><kbd>E</kbd></span><b>Camera mode</b>
        <span><kbd>Enter</kbd></span><b>Start / menu</b>
        <span><kbd>F5</kbd> <kbd>F7</kbd></span><b>Quick save / load</b>
      </div>
      <div class="note" id="save-note">Your progress is saved in this browser. Gamepads work too.</div>
    </div>

    <div id="paused" class="overlay" hidden>
      <h2>Paused</h2>
      <div class="note">Click to keep playing</div>
    </div>

    <div id="corner">
      <button id="mute" title="Mute (M)" aria-label="Mute">
        <svg id="icon-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="icon-muted" viewBox="0 0 24 24" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div id="toast"></div>
    <div id="achievement" role="status" aria-live="polite">
      <svg class="star" viewBox="0 0 24 24"><path fill="#fbd000" stroke="#b8860b" stroke-width="1.2"
        stroke-linejoin="round" d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.9l-6.4 3.5L7 14.3l-5.3-5 7.2-.9z"/></svg>
      <div><div class="label">Achievement unlocked</div><div class="title"></div><div class="desc"></div></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const GAME_URL = 'game.zip';
  const SAVE_DIR = '/m64p/save';

  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas'), splash = $('splash'), pausedEl = $('paused');
  const playBtn = $('play'), statusEl = $('status'), bar = $('progress').firstElementChild;
  const debug = new URLSearchParams(location.search).has('debug');

  let module = null, running = false, romBytes = null, muted = false;

  function log(text) { if (debug || /rror/.test(text)) console.log(text); }
  function setStatus(text) { statusEl.textContent = text; }

  let toastTimer = 0;
  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  function updateSaveNote() {
    if (!cloud.onGamplo) return;
    $('save-note').textContent = cloud.player
      ? 'Signed in as ' + cloud.player.displayName + ': your progress is saved to your Gamplo account.'
      : 'Playing as a guest: sign in to Gamplo to keep your progress on any device.';
  }

  function syncSaves() {
    if (!module) return;
    module.FS.syncfs(false, (err) => { if (err) console.warn('Saving to IndexedDB failed', err); });
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src;
      el.onload = resolve;
      el.onerror = () => reject(new Error('could not load ' + src));
      document.head.appendChild(el);
    });
  }

  // Download with progress (the ROM is most of the page's weight)
  async function download(url, onProgress) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = +res.headers.get('Content-Length') || 0;
    if (!res.body || !total) return new Uint8Array(await res.arrayBuffer());
    const reader = res.body.getReader(), chunks = [];
    let received = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      onProgress(received / total);
    }
    const out = new Uint8Array(received);
    let offset = 0;
    for (const c of chunks) { out.set(c, offset); offset += c.length; }
    return out;
  }

  const cloud = {
    SLOT: 0,
    MAX_BYTES: 100 * 1024,
    MIN_INTERVAL_MS: 7000,   // Gamplo allows 10 saves per minute
    FILE_RE: /\.(eep|sra|fla|mpk)$/i,
    enabled: false,
    onGamplo: false,
    player: null,
    lastSignature: null,
    lastUpload: 0,
    uploading: false,
    retryTimer: null,

    // Resolves once the SDK is ready (or clearly unavailable).
    init() {
      this.ready = new Promise((resolve) => {
        const done = () => resolve();
        setTimeout(done, 5000);
        loadScript('https://gamplo.com/sdk/gamplo.js').then(() => {
          if (!window.Gamplo) return done();
          Gamplo.onReady(() => {
            const player = Gamplo.getPlayer();
            this.onGamplo = true;
            this.player = player;
            this.enabled = !!player;
            updateSaveNote();
            done();
          });
        }).catch(done);
      });
      return this.ready;
    },

    files() {
      const FS = module.FS, out = [];
      for (const name of FS.readdir(SAVE_DIR)) {
        if (!this.FILE_RE.test(name)) continue;
        const st = FS.stat(SAVE_DIR + '/' + name);
        out.push({ name, mtime: st.mtime.getTime(), size: st.size });
      }
      return out;
    },

    async gzip(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    },

    async gunzip(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    },

    toBase64(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i += 0x8000)
        s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    },

    fromBase64(text) {
      return Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
    },

    // Bring in cloud saves that are newer than the local copies.
    async restore() {
      await this.ready;
      if (!this.enabled) return;
      try {
        const save = await Gamplo.getSave(this.SLOT);
        if (!save || save.format !== 'm64p-saves-1') return;
        const local = Object.fromEntries(this.files().map((f) => [f.name, f]));
        let restored = 0;
        for (const [name, f] of Object.entries(save.files || {})) {
          if (!this.FILE_RE.test(name) || name.includes('/')) continue;
          if (local[name] && local[name].mtime >= f.mtime) continue;
          const path = SAVE_DIR + '/' + name;
          module.FS.writeFile(path, await this.gunzip(this.fromBase64(f.data)));
          module.FS.utime(path, f.mtime, f.mtime);
          restored++;
        }
        if (restored) { log('Restored ' + restored + ' save file(s) from Gamplo'); syncSaves(); }
        this.lastSignature = this.signature();
      } catch (e) {
        log('Could not load cloud saves: ' + e.message);
      }
    },

    signature() {
      return JSON.stringify(this.files());
    },

    // Upload when a save file changed, respecting the rate limit.
    async upload() {
      if (!this.enabled || this.uploading || !module) return;
      const sig = this.signature();
      if (sig === this.lastSignature) return;
      const wait = this.lastUpload + this.MIN_INTERVAL_MS - Date.now();
      if (wait > 0) {
        if (!this.retryTimer)
          this.retryTimer = setTimeout(() => { this.retryTimer = null; this.upload(); }, wait);
        return;
      }
      this.uploading = true;
      try {
        // newest first; drop the oldest games' saves if the slot overflows
        const files = this.files().sort((a, b) => b.mtime - a.mtime);
        const payload = { format: 'm64p-saves-1', files: {} };
        let size = 64;
        for (const f of files) {
          const data = this.toBase64(await this.gzip(module.FS.readFile(SAVE_DIR + '/' + f.name)));
          const entry = { mtime: f.mtime, data };
          const entrySize = JSON.stringify(entry).length + f.name.length + 8;
          if (size + entrySize > this.MAX_BYTES) { log('Cloud slot full, not syncing ' + f.name); continue; }
          payload.files[f.name] = entry;
          size += entrySize;
        }
        this.lastUpload = Date.now();
        await Gamplo.setSave(payload, this.SLOT);
        this.lastSignature = sig;
      } catch (e) {
        log('Cloud save failed: ' + e.message);
        if (/403/.test(e.message)) this.enabled = false;
      } finally {
        this.uploading = false;
      }
    },
  };



  // Achievements, after the RetroAchievements set for Super Mario 64 (game
  // 10003). Only the ones that can be decided from the game's save data are
  // implemented: star totals, completed courses, castle secret stars,
  // cannons and cap switches. The save data lives in RAM (gSaveBuffer, at
  // 0x80202F00 in the European ROM) and is updated the moment a star or
  // switch is collected, before the game writes it to EEPROM.
  // Each key must exist as an achievement on the game's Gamplo page.
  const achievements = {
    SAVE_BUFFER: 0x80202F00,
    FILE_SIZE: 56,          // struct SaveFile; two copies per file
    COURSES: ["Bob-omb Battlefield", "Whomp's Fortress", 'Jolly Roger Bay', 'Cool, Cool Mountain',
      "Big Boo's Haunt", 'Hazy Maze Cave', 'Lethal Lava Land', 'Shifting Sand Land',
      'Dire, Dire Docks', "Snowman's Land", 'Wet-Dry World', 'Tall, Tall Mountain',
      'Tiny-Huge Island', 'Tick Tock Clock', 'Rainbow Ride'],
    COURSE_TITLES: ['Full Course in the Battlefield', 'Full Course in the Fortress', 'Full Course in the Bay',
      'Full Course in the Cool Mountain', 'Full Course Haunted House', 'Full Course in the Maze Cave',
      'Full Course in the Lava Land', 'Full Course in the Desert Land', 'Full Course in the Dire Docks',
      "Full Course in the Snowman's Land", 'Full Course in the Wet-Dry World', 'Full Course in the Tall Mountain',
      'Full Course in the Tiny-Huge Island', 'Full Course in the Tick Tock Clock', 'Full Course in the Rainbow'],
    COURSE_KEYS: ['full-course-bob', 'full-course-wf', 'full-course-jrb', 'full-course-ccm', 'full-course-bbh',
      'full-course-hmc', 'full-course-lll', 'full-course-ssl', 'full-course-ddd', 'full-course-sl',
      'full-course-wdw', 'full-course-ttm', 'full-course-thi', 'full-course-ttc', 'full-course-rr'],

    list: null,
    unlocked: new Set(),
    pending: [],
    shown: [],
    showing: false,
    sending: false,
    synced: false,

    build() {
      const stars = (n, key, title, desc, points) =>
        ({ key, title, desc, points, test: (f) => f.stars >= n });
      this.list = [
        stars(1, 'stars-1', 'A New Journey', 'Grab your first Power Star.', 1),
        stars(8, 'stars-8', 'Ready to Fight Bowser', 'Grab 8 Power Stars.', 3),
        stars(30, 'stars-30', 'Ready to Rematch Bowser', 'Grab 30 Power Stars.', 5),
        stars(50, 'stars-50', 'Lobby at the Top', 'Grab 50 Power Stars.', 10),
        stars(70, 'stars-70', 'Ready for the Final Match', 'Grab 70 Power Stars.', 10),
        stars(120, 'stars-120', 'Full Power', 'Grab 120 Power Stars.', 25),
        ...this.COURSES.map((name, i) => ({
          key: this.COURSE_KEYS[i], title: this.COURSE_TITLES[i],
          desc: 'Collect all 7 Power Stars in ' + name + '.', points: 5,
          test: (f) => f.courseStars[i] === 7 })),
        { key: 'castle-secret-stars', title: 'Full Course Around the Castle',
          desc: 'Collect all 15 Castle Secret Stars.', points: 10, test: (f) => f.secretStars >= 15 },
        { key: 'cannoneer', title: 'Cannoneer', desc: 'Activate all 11 cannons in the courses.',
          points: 10, test: (f) => f.cannons >= 11 },
        { key: 'red-switch', title: 'Fly Baby Fly', desc: 'Activate the Red Switch.', points: 2,
          test: (f) => (f.flags & 0x2) !== 0 },
        { key: 'green-switch', title: 'Metal Head', desc: 'Activate the Green Switch.', points: 2,
          test: (f) => (f.flags & 0x4) !== 0 },
        { key: 'blue-switch', title: 'Invisible', desc: 'Activate the Blue Switch.', points: 3,
          test: (f) => (f.flags & 0x8) !== 0 },
      ];
      try {
        for (const key of JSON.parse(localStorage.getItem('sm64-achievements') || '[]')) this.unlocked.add(key);
      } catch (e) { /* storage unavailable */ }
    },

    // Already unlocked on Gamplo: don't announce or send them again.
    async syncFromGamplo() {
      await cloud.ready;
      try {
        if (cloud.enabled) {
          for (const a of await Gamplo.getAchievements()) if (a.unlocked) this.unlocked.add(a.key);
          this.persist();
        }
      } catch (e) {
        log('Could not load achievements: ' + e.message);
      } finally {
        this.synced = true;
      }
    },

    persist() {
      try { localStorage.setItem('sm64-achievements', JSON.stringify([...this.unlocked])); } catch (e) { /* ignore */ }
    },

    // Read the four save files (first copy) from emulated RAM.
    readFiles() {
      const heap = module.HEAPU8, base = module._web_rdram();
      const byte = (addr) => heap[base + ((addr - 0x80000000) ^ 3)];
      const pop = (v) => { let n = 0; for (; v; v &= v - 1) n++; return n; };
      const files = [];
      for (let i = 0; i < 4; i++) {
        const a = this.SAVE_BUFFER + i * 2 * this.FILE_SIZE;
        const flags = ((byte(a + 8) << 24) | (byte(a + 9) << 16) | (byte(a + 10) << 8) | byte(a + 11)) >>> 0;
        const raw = [];
        for (let c = 0; c < 25; c++) raw.push(byte(a + 12 + c));
        const courseStars = raw.map((v) => pop(v & 0x7F));
        const castleFlagStars = pop((flags >>> 24) & 0x7F);       // Toad and MIPS
        const stars = courseStars.reduce((x, y) => x + y, 0) + castleFlagStars;
        const secretStars = courseStars.slice(15).reduce((x, y) => x + y, 0) + castleFlagStars;
        // a course's cannon flag is bit 7 of the next course's byte
        const cannons = raw.slice(1).filter((v) => v & 0x80).length;
        files.push({ flags, courseStars, stars, secretStars, cannons });
      }
      return files;
    },

    check() {
      if (!running || !module || !this.list || !this.synced) return;
      let files;
      try { files = this.readFiles(); } catch (e) { return; }
      for (const a of this.list) {
        if (this.unlocked.has(a.key) || !files.some((f) => a.test(f))) continue;
        this.unlocked.add(a.key);
        this.persist();
        this.pending.push(a.key);
        this.announce(a);
      }
      this.send();
    },

    // Tell Gamplo, one at a time; failures are retried on the next check.
    async send() {
      if (this.sending || !this.pending.length || !cloud.enabled) return;
      this.sending = true;
      try {
        while (this.pending.length) {
          const key = this.pending[0];
          try {
            await Gamplo.unlockAchievement(key);
          } catch (e) {
            log('Achievement ' + key + ' not sent: ' + e.message);
            if (/403|404|not found/i.test(e.message)) this.pending.shift();   // guest, or not set up
            break;
          }
          this.pending.shift();
        }
      } finally {
        this.sending = false;
      }
    },

    announce(a) {
      this.shown.push(a);
      if (!this.showing) this.next();
    },

    next() {
      const a = this.shown.shift(), el = $('achievement');
      if (!a) { this.showing = false; return; }
      this.showing = true;
      el.querySelector('.title').textContent = a.title + ' · ' + a.points + (a.points === 1 ? ' pt' : ' pts');
      el.querySelector('.desc').textContent = a.desc +
        (cloud.onGamplo && !cloud.player ? ' Sign in to keep it.' : '');
      el.classList.add('show');
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => this.next(), 450); }, 3600);
    },
  };

  // Render resolution: sharp on large and high-DPI screens, capped to keep
  // the GPU load reasonable.
  function renderSize() {
    const rect = $('screen').getBoundingClientRect();
    const h = Math.round(Math.min(Math.max(rect.height * (window.devicePixelRatio || 1), 480), 720) / 8) * 8;
    return [Math.round(h * 4 / 3), h];
  }

  async function start() {
    if (running || !module || !romBytes) return;
    running = true;
    playBtn.disabled = true;
    playBtn.textContent = 'Starting…';
    module.FS.writeFile('/game.zip', romBytes);
    romBytes = null;
    await cloud.restore();
    canvas.focus();
    const [w, h] = renderSize();
    const fail = (e) => {
      if (e === 'unwind' || (e && e.name === 'ExitStatus')) return;
      console.error(e);
      showError('Something went wrong. Reload the page to try again.');
    };
    try {
      const result = module.callMain(['/game.zip', String(w), String(h)]);
      if (result && result.catch) result.catch(fail);
    } catch (e) {
      fail(e);
    }
  }

  function showError(text) {
    splash.hidden = false;
    pausedEl.hidden = true;
    playBtn.textContent = 'Reload';
    playBtn.disabled = false;
    playBtn.onclick = () => location.reload();
    setStatus(text);
  }

  // Pause when the game loses keyboard focus (another tab, or a click
  // outside the game frame), like a Flash game; a click resumes.
  function pause() {
    if (!running || !module || !splash.hidden) return;
    module._web_set_paused(1);
    pausedEl.hidden = false;
  }
  function resume() {
    if (!running || !module) return;
    pausedEl.hidden = true;
    canvas.focus();
    module._web_set_paused(0);
  }
  window.addEventListener('blur', pause);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pause(); syncSaves(); cloud.upload(); }
  });
  pausedEl.addEventListener('click', resume);

  playBtn.addEventListener('click', start);
  window.addEventListener('keydown', (e) => {
    // Enter or Space on the splash starts the game
    if (!running && (e.key === 'Enter' || e.key === ' ') && !playBtn.disabled) { e.preventDefault(); start(); return; }
    if (!running) return;
    if (!pausedEl.hidden) { resume(); return; }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
    if (e.key === 'F5') { e.preventDefault(); toast('Game saved'); setTimeout(syncSaves, 1500); }
    if (e.key === 'F7') { e.preventDefault(); toast('Game loaded'); }
    if (e.key === 'm' || e.key === 'M') setMuted(!muted);
  }, { passive: false });

  // corner buttons
  function setMuted(value) {
    muted = value;
    module._web_set_muted(muted ? 1 : 0);
    $('icon-sound').style.display = muted ? 'none' : '';
    $('icon-muted').style.display = muted ? '' : 'none';
    toast(muted ? 'Sound off' : 'Sound on');
  }
  $('mute').addEventListener('click', (e) => { e.stopPropagation(); setMuted(!muted); canvas.focus(); });
  $('fullscreen').addEventListener('click', (e) => {
    e.stopPropagation();
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    canvas.focus();
  });
  let cornerTimer = 0;
  window.addEventListener('mousemove', () => {
    if (!running) return;
    $('corner').classList.add('show');
    clearTimeout(cornerTimer);
    cornerTimer = setTimeout(() => $('corner').classList.remove('show'), 2000);
  });
  canvas.addEventListener('mousedown', () => canvas.focus());

  window.addEventListener('pagehide', () => { syncSaves(); cloud.upload(); });
  setInterval(() => { if (running) syncSaves(); }, 10000);
  setInterval(() => { if (running) cloud.upload(); }, 3000);

  // JSPI lets the emulator pause for the browser without slowing it down;
  // browsers without it get the (slower) Asyncify build.
  const useJspi = typeof WebAssembly.Suspending === 'function' &&
                  !new URLSearchParams(location.search).has('asyncify');

  cloud.init();
  achievements.build();
  achievements.syncFromGamplo();
  setInterval(() => achievements.check(), 1000);
  setStatus('Loading…');
  const emulator = loadScript(useJspi ? 'mupen64plus-jspi.js' : 'mupen64plus.js').then(() => createMupen64Plus({
    canvas,
    print: log,
    printErr: log,
    preRun: [(m) => {
      m.FS.mkdirTree(SAVE_DIR);
      m.FS.mount(m.IDBFS, {}, SAVE_DIR);
      m.addRunDependency('idbfs');
      m.FS.syncfs(true, (err) => {
        if (err) console.warn('Loading saves from IndexedDB failed', err);
        m.removeRunDependency('idbfs');
      });
    }],
    onGameStart() {
      splash.hidden = true;
      if (!document.hasFocus()) pause();
    },
    onGameStop() {
      syncSaves();
      cloud.upload();
      running = false;
      showError('The game stopped. Reload the page to play again.');
    },
  }));
  const rom = download(GAME_URL, (f) => { bar.style.width = (f * 100).toFixed(1) + '%'; });

  Promise.all([emulator, rom]).then(([m, bytes]) => {
    module = m;
    window.mupen = m;
    romBytes = bytes;
    bar.style.width = '100%';
    $('progress').style.visibility = 'hidden';
    setStatus('');
    playBtn.textContent = 'Play';
    playBtn.disabled = false;
    playBtn.focus();
    log('Using ' + (useJspi ? 'JSPI' : 'Asyncify') + ' build');
  }).catch((e) => {
    console.error(e);
    showError('Could not load the game: ' + e.message);
  });
})();
</script>
</body>
</html>
